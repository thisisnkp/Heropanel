name: Release

# Triggers when you push a version tag, e.g.:
#   git tag v1.2.3 && git push origin v1.2.3
on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write   # needed to create GitHub Releases and upload assets

jobs:
  # ── 1. Build the frontend SPA ────────────────────────────────────────────
  build-web:
    name: Build frontend (SPA)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: web/package-lock.json

      - name: Install & build
        run: |
          cd web
          npm ci
          npm run build

      - name: Upload dist
        uses: actions/upload-artifact@v4
        with:
          name: web-dist
          path: web/dist/
          retention-days: 1

  # ── 2. Build Go binaries for every target platform ───────────────────────
  build-binaries:
    name: Build binaries (${{ matrix.arch }})
    needs: build-web
    runs-on: ubuntu-latest
    strategy:
      matrix:
        arch: [amd64, arm64]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"

      - name: Download web dist
        uses: actions/download-artifact@v4
        with:
          name: web-dist
          path: web/dist/

      - name: Build binaries
        env:
          GOOS: linux
          GOARCH: ${{ matrix.arch }}
          CGO_ENABLED: "0"
          VERSION: ${{ github.ref_name }}
        run: |
          mkdir -p dist/linux-${{ matrix.arch }}
          for bin in npd np-broker np-installer; do
            go build \
              -trimpath \
              -ldflags "-s -w -X main.version=${VERSION}" \
              -o dist/linux-${{ matrix.arch }}/$bin \
              ./cmd/$bin
          done

      - name: Create archives
        env:
          VERSION: ${{ github.ref_name }}
          ARCH: ${{ matrix.arch }}
        run: |
          cd dist/linux-${ARCH}
          for bin in npd np-broker np-installer; do
            tar -czf ../nexpanel-${VERSION}-linux-${ARCH}-${bin}.tar.gz $bin
          done
          tar -czf ../nexpanel-${VERSION}-linux-${ARCH}.tar.gz npd np-broker np-installer

      - name: Upload archives
        uses: actions/upload-artifact@v4
        with:
          name: archives-linux-${{ matrix.arch }}
          path: dist/*.tar.gz
          retention-days: 1

  # ── 3. Sign the manifests and publish the GitHub Release ─────────────────
  release:
    name: Publish GitHub Release
    needs: build-binaries
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download all archives (amd64)
        uses: actions/download-artifact@v4
        with:
          name: archives-linux-amd64
          path: release/

      - name: Download all archives (arm64)
        uses: actions/download-artifact@v4
        with:
          name: archives-linux-arm64
          path: release/

      - name: Generate SHA256SUMS
        run: |
          cd release
          sha256sum *.tar.gz > SHA256SUMS
          cat SHA256SUMS

      - name: Sign SHA256SUMS (optional)
        if: ${{ env.NP_RELEASE_KEY != '' }}
        env:
          NP_RELEASE_KEY: ${{ secrets.NP_RELEASE_KEY }}
        run: |
          go run ./cmd/np-installer --sign release --key "$NP_RELEASE_KEY"

      - name: Detect pre-release
        id: prerelease
        run: |
          if echo "${{ github.ref_name }}" | grep -qE '-(alpha|beta|rc|nightly)'; then
            echo "is_prerelease=true" >> "$GITHUB_OUTPUT"
          else
            echo "is_prerelease=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: "NexPanel ${{ github.ref_name }}"
          prerelease: ${{ steps.prerelease.outputs.is_prerelease }}
          generate_release_notes: true
          files: |
            release/*.tar.gz
            release/SHA256SUMS
            release/SHA256SUMS.sig
          fail_on_unmatched_files: false
