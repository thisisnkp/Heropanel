version: '3.8'

services:
  nexpanel:
    build:
      context: .
      dockerfile: Dockerfile
    image: nexpanel:latest
    container_name: nexpanel
    restart: unless-stopped
    ports:
      - "18443:18443"  # NexPanel Control Plane & React UI
      - "80:80"        # OpenLiteSpeed HTTP Edge
      - "443:443"      # OpenLiteSpeed HTTPS Edge
    environment:
      - NP_SERVER_HOST=0.0.0.0
      - NP_SERVER_PORT=18443
      - NP_BROKER_TOKEN=nexpanel-docker-secret-token
      - NP_DATABASE_DRIVER=sqlite
      - NP_DATABASE_DSN=/srv/nexpanel/data/np.db
    volumes:
      - nexpanel_data:/srv/nexpanel/data
      - nexpanel_sites:/srv/nexpanel/sites
      - nexpanel_mysql:/var/lib/mysql

volumes:
  nexpanel_data:
  nexpanel_sites:
  nexpanel_mysql:
